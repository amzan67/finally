<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Restaurant Menu | AR-STUDIOS.PK</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; color: #333; }
        .viewer-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; }
        
        model-viewer { 
            width: 100%; 
            height: 450px; 
            background-color: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .button-group { margin: 20px 0; }
        button.category-btn { padding: 12px 25px; margin: 5px; cursor: pointer; border-radius: 25px; border: 2px solid #2ecc71; background: white; font-weight: bold; transition: 0.3s; }
        button.category-btn:hover { background: #2ecc71; color: white; }

        #item-price { color: #2ecc71; font-weight: bold; font-size: 1.8rem; margin-top: 10px; }
        #ar-button {
            background-color: #2ecc71;
            color: white;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>AR-STUDIOS.PK</h1>
    <h2 id="restaurant-name">Digital Menu Demo</h2>

    <div class="button-group">
        <button class="category-btn" onclick="updateMenu('burger.glb', 'Classic Burger', 'A Burger with some Fries.', 'PKR 400')">Burgers</button>
        <button class="category-btn" onclick="updateMenu('donut.glb', 'Donut', '7 Creamy Donuts.', 'PKR 200')">Donuts</button>
    </div>

    <div class="viewer-container">
        <model-viewer id="main-viewer" 
            src="burger.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor"
            camera-controls 
            shadow-intensity="1" 
            environment-image="neutral"
            exposure="1"
            touch-action="pan-y">
            
            <button slot="ar-button" id="ar-button">👋 View in Space</button>
        </model-viewer>
    </div>

    <h2 id="item-name">Classic Burger</h2>
    <p id="item-description">A juicy beef patty with fresh lettuce and cheese.</p>
    <div id="item-price">PKR 400</div>

    <script>
        function updateMenu(modelFile, name, description, price) {
            const viewer = document.getElementById('main-viewer');
            
            // 1. Clear the source first to prevent freezing
            viewer.src = ""; 

            // 2. Small delay to let the browser process the change
            setTimeout(() => {
                viewer.src = modelFile;
                document.getElementById('item-name').innerText = name;
                document.getElementById('item-description').innerText = description;
                document.getElementById('item-price').innerText = price;
            }, 50);
        }

        // Listen for AR failures
        const mv = document.querySelector("#main-viewer");
        mv.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'failed') {
                console.log("AR failed - background might turn black if permissions are denied.");
            }
        });
    </script>
</body>
</html>
